name: CI - Comprehensive Testing

on:
  push:
    branches: [main, miband]
    tags:
      - 'v*'
  pull_request:
    branches: [main, miband]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Job 1: Host Unit Tests (GoogleTest, ~196 tests)
  # ═══════════════════════════════════════════════════════════════════
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip3 install kconfiglib pexpect

    - name: Cache GoogleTest
      uses: actions/cache@v4
      with:
        path: build_tests/_deps
        key: gtest-${{ hashFiles('tests/CMakeLists.txt') }}

    - name: Configure CMake
      run: cmake -S tests -B build_tests -DCMAKE_BUILD_TYPE=Debug

    - name: Build tests
      run: cmake --build build_tests -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build_tests --output-on-failure --timeout 30

  # ═══════════════════════════════════════════════════════════════════
  # Job 2: Sanitizer Builds (ASAN + UBSAN)
  # ═══════════════════════════════════════════════════════════════════
  sanitize:
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip3 install kconfiglib pexpect

    - name: Configure with ASAN + UBSAN
      run: |
        cmake -S tests -B build_san \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_ASAN=ON \
          -DENABLE_UBSAN=ON

    - name: Build
      run: cmake --build build_san -j$(nproc)

    - name: Run tests with sanitizers
      run: ctest --test-dir build_san --output-on-failure --timeout 30

  # ═══════════════════════════════════════════════════════════════════
  # Job 2d: ThreadSanitizer (TSAN) — concurrency data-race detection
  #
  # Scheduler / IPC / mutex-PIP concurrency tests under TSAN. TSAN cannot
  # be combined with ASAN/UBSAN, hence a dedicated build. ctest runs under
  # `setarch -R`: TSAN needs a large contiguous shadow-memory mapping that
  # high-entropy ASLR on modern runner kernels can break
  # (FATAL: ThreadSanitizer: unexpected memory mapping).
  # ═══════════════════════════════════════════════════════════════════
  tsan:
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip3 install kconfiglib pexpect

    - name: Configure with TSAN
      run: |
        cmake -S tests -B build_tsan \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_TSAN=ON

    - name: Build
      run: cmake --build build_tsan -j$(nproc)

    - name: Run tests under TSAN
      run: setarch $(uname -m) -R ctest --test-dir build_tsan --output-on-failure --timeout 60

  # ═══════════════════════════════════════════════════════════════════
  # Job 2b: Static Analysis (clang-tidy) — reporting, NON-blocking
  #
  # High-signal checks only; WarningsAsErrors empty so findings never fail.
  # Bare-metal TU headers can't be parsed by host clang -> frontend "errors"
  # are toolchain noise, not defects; job ends with `exit 0` (non-blocking).
  # Low-level code keeps precise `// NOLINT(check-name)` instead of family off.
  # ═══════════════════════════════════════════════════════════════════
  static-analysis:
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install toolchain + clang-tidy
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev libstdc++-arm-none-eabi-newlib clang-tidy

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      run: pip3 install kconfiglib pexpect

    - name: Configure firmware build (compile_commands.json for ALL sources)
      run: |
        mkdir -p build_analysis
        cd build_analysis
        cmake \
          -DBOARD=lm3s6965-qb \
          -DCMAKE_TOOLCHAIN_FILE=../config/toolchain.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          ..

    - name: Run clang-tidy (reporting, non-fatal)
      # No --warnings-as-errors: findings are reported, not fatal.
      # Frontend-parse noise (newlib-ARM/CMSIS on host clang) and any check
      # findings never block the pipeline: the job always exits 0.
      shell: bash
      run: |
        set -eo pipefail

        # Collect real translation units. Top-level globs such as kernel/*.cpp
        # expand to nothing (sources live in subdirectories) and clang-tidy then
        # treats the literal '*' path as a file -> hard failure.
        mapfile -t srcs < <(
          find kernel vfs apps drivers net adapter experimental ui metrics utils arch \
            -type f -name '*.cpp' 2>/dev/null | sort -u
        )
        if [ "${#srcs[@]}" -eq 0 ]; then
          echo "No .cpp sources found under the firmware tree; skipping clang-tidy."
          exit 0
        fi

        # compile_commands.json stores the ARM cross-compile command. Host clang
        # needs the target + newlib sysroot include paths to parse those TUs.
        NEWLIB_INC="$(arm-none-eabi-gcc -print-file-name=include 2>/dev/null)"
        SYSROOT_INC="/usr/arm-none-eabi/include"

        extra_args=()
        extra_args+=(--extra-arg=--target=arm-none-eabi)
        if [ -n "${NEWLIB_INC}" ]; then
          extra_args+=(--extra-arg="-I${NEWLIB_INC}")
        fi
        if [ -d "${SYSROOT_INC}" ]; then
          extra_args+=(--extra-arg="-I${SYSROOT_INC}")
        fi

        if ! clang-tidy \
          -p build_analysis \
          --header-filter='(kernel|apps|drivers|net|adapter|experimental|vfs|syscall|ui|metrics|utils|arch)/.*' \
          "${extra_args[@]}" \
          "${srcs[@]}" \
          -checks='-*,\
            bugprone-use-after-move,\
            bugprone-signed-char-misuse,\
            bugprone-unhandled-self-assignment,\
            bugprone-assert-side-effect,\
            bugprone-dangling-handle,\
            bugprone-string-constructor,\
            bugprone-undelegated-constructor,\
            bugprone-duplicate-branch,\
            bugprone-branch-clone,\
            bugprone-misplaced-widening-cast,\
            cert-dcl21-cpp,\
            cert-oop58-cpp,\
            cert-fio38-c,\
            cert-env33-c,\
            cert-msc50-cpp,\
            cert-msc32-c,\
            cert-err34-c,\
            performance-move-const-arg,\
            performance-noexcept-move-constructor,\
            performance-unnecessary-value-param' \
          2>&1 | tee clang-tidy-report.txt; then
          # Frontend parse errors on bare-metal headers are toolchain noise,
          # not code defects -> report them but never fail the job.
          echo "clang-tidy finished with frontend errors (expected for bare-metal); full results in clang-tidy-report.txt"
        fi
        exit 0

    - name: Upload analysis report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clang-tidy-report
        path: clang-tidy-report.txt


  # ═══════════════════════════════════════════════════════════════════
  # Job 2c: cppcheck — fast C/C++ static analysis gate
  # Focus on the C-driver layer (lwIP adapter, ed25519) + kernel headers.
  # Do not enumerate every preprocessor configuration on each push: that work
  # grows rapidly with Kconfig combinations and delayed the critical CI path.
  # ═══════════════════════════════════════════════════════════════════
  cppcheck:
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
      with:
        # Need the previous commit to derive the changed source-file set.
        fetch-depth: 2

    - name: Install cppcheck
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends cppcheck

    - name: Run cppcheck (failure gate)
      # pipefail: propagate --error-exitcode=1 through the tee pipe.
      # Without pipefail the pipe always exits 0 regardless of cppcheck result.
      shell: bash
      run: |
        set -eo pipefail

        # Analyze only code touched by this event.  The previous full-tree scan
        # was both blocking and unnecessarily slow for documentation/CI-only
        # changes; this remains a failure gate for every changed source file.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base_ref="HEAD^1"
          head_ref="HEAD"
        else
          base_ref="${{ github.event.before }}"
          head_ref="${{ github.sha }}"
        fi

        if ! git rev-parse --verify "${base_ref}^{commit}" >/dev/null 2>&1; then
          # Graceful fallback for an initial push or an unusually shallow clone.
          base_ref="HEAD^"
          head_ref="HEAD"
        fi

        mapfile -t sources < <(
          git diff --name-only --diff-filter=ACMR "${base_ref}" "${head_ref}" |
            grep -E '^(kernel|apps|net|adapter|drivers|vfs|syscall|experimental/apps)/.*\.(c|cc|cpp|cxx|h|hpp)$' || true
        )

        if [ "${#sources[@]}" -eq 0 ]; then
          echo "No production C/C++ files changed; cppcheck gate skipped."
          : > cppcheck-report.txt
          exit 0
        fi

        printf 'Cppcheck input files:\n%s\n' "${sources[*]}"
        cppcheck \
          --enable=warning,performance,portability \
          --error-exitcode=1 \
          --inline-suppr \
          --suppress=toomanyconfigs \
          --suppress='*:3rdparty/*' \
          --suppress='*:tests/*' \
          --suppress='*:build_*' \
          --suppress='missingIncludeSystem' \
          --suppress='unusedFunction' \
          --suppress='noExplicitConstructor:kernel/task.hpp' \
          --suppress='duplInheritedMember:ui/screen_navigator.hpp' \
          --suppress='objectIndex:apps/watch/font_engine.hpp' \
          --suppress='uninitMemberVar:kernel/mm/memory_pool.hpp' \
          --suppress='incorrectLogicOperator:experimental/apps/notification_center.cpp' \
          -I kernel -I vfs -I net -I net/firewall -I net/scanner \
          -I adapter -I adapter/net -I drivers -I apps -I syscall \
          -I config -I boards \
          -I 3rdparty/lwip/src/include -I 3rdparty/lwip/src/include/ipv4 \
          "${sources[@]}" \
          2>&1 | tee cppcheck-report.txt

    - name: Upload analysis report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-report
        path: cppcheck-report.txt

  # ═══════════════════════════════════════════════════════════════════
  # Job 2e: clang-format incremental gate — BLOCKING
  #
  # Only the lines changed by this event are checked (git clang-format),
  # so untouched legacy code never fails the gate. 3rdparty/ and tests/
  # are excluded: vendored code and test fixtures follow their own style.
  # ═══════════════════════════════════════════════════════════════════
  clang-format:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Install clang-format
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends clang-format

    - name: Check formatting of changed lines
      shell: bash
      run: |
        set -eo pipefail

        # Same base-selection logic as the cppcheck gate.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base_ref="HEAD^1"
          head_ref="HEAD"
        else
          base_ref="${{ github.event.before }}"
          head_ref="${{ github.sha }}"
        fi

        if ! git rev-parse --verify "${base_ref}^{commit}" >/dev/null 2>&1; then
          # Graceful fallback for an initial push or a shallow clone.
          base_ref="HEAD^"
          head_ref="HEAD"
        fi

        mapfile -t files < <(
          git diff --name-only --diff-filter=ACMR "${base_ref}" "${head_ref}" |
            grep -E '\.(c|cc|cpp|cxx|h|hpp)$' |
            grep -vE '^(3rdparty|tests)/' || true
        )

        if [ "${#files[@]}" -eq 0 ]; then
          echo "No production C/C++ files changed; clang-format gate skipped."
          exit 0
        fi

        printf 'clang-format input files:\n%s\n' "${files[*]}"

        # git clang-format --diff prints a patch for changed lines that do not
        # conform to .clang-format; the two fixed strings below are its
        # documented "nothing to do" outputs.
        OUTPUT=$(git clang-format --diff "${base_ref}" "${files[@]}" 2>&1) || true

        if [ -z "$OUTPUT" ] \
           || [ "$OUTPUT" = "no modified files to format" ] \
           || [ "$OUTPUT" = "clang-format did not modify any files" ]; then
          echo "clang-format gate passed."
        else
          echo "::error::clang-format gate failed — changed lines violate .clang-format; run 'git clang-format <base>' locally"
          echo "$OUTPUT"
          exit 1
        fi

  # ═══════════════════════════════════════════════════════════════════
  # Job 3: Target Build — Cortex-M3 (LM3S6965-QB) + QEMU HIL
  # ═══════════════════════════════════════════════════════════════════
  build-lm3s6965:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install ARM toolchain + QEMU
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev libstdc++-arm-none-eabi-newlib qemu-system-arm

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      run: pip3 install kconfiglib pexpect

    - name: Configure CMake
      run: |
        mkdir -p build_lm3s
        cd build_lm3s
        cmake -DBOARD=lm3s6965-qb -DCMAKE_TOOLCHAIN_FILE=../config/toolchain.cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build firmware
      run: |
        cd build_lm3s
        make -j$(nproc)

    - name: QEMU Smoke Boot Test
      run: |
        cd build_lm3s
        timeout 30s qemu-system-arm -M lm3s6965evb -cpu cortex-m3 \
          -display none -serial stdio -monitor none \
          -kernel auroraOS.elf 2>&1 | tee ../boot.log || true
        grep -q "aurora> " ../boot.log && echo "Boot OK" || (echo "Boot FAILED" && exit 1)

    - name: HIL Test
      run: |
        cd build_lm3s
        python3 ../scripts/hil_runner.py

    - name: Check firmware size
      run: |
        arm-none-eabi-size build_lm3s/auroraOS.elf
        echo "---"
        TEXT=$(arm-none-eabi-size build_lm3s/auroraOS.elf | tail -1 | awk '{print $1}')
        DATA=$(arm-none-eabi-size build_lm3s/auroraOS.elf | tail -1 | awk '{print $2}')
        BSS=$(arm-none-eabi-size build_lm3s/auroraOS.elf | tail -1 | awk '{print $3}')
        TOTAL=$((TEXT + DATA + BSS))
        echo "Total: ${TOTAL} bytes"
        if [ $TOTAL -gt 262144 ]; then
          echo "WARNING: Firmware exceeds 256KB Flash!"
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-lm3s6965
        path: build_lm3s/auroraOS.elf

  # ═══════════════════════════════════════════════════════════════════
  # Job 4: Target Build — RISC-V 32 (QEMU Virt)
  # ═══════════════════════════════════════════════════════════════════
  build-rv32:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install RISC-V toolchain + QEMU
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      run: pip3 install kconfiglib pexpect

    - name: Reset stale Kconfig output (must match this board, not whatever was last committed)
      run: |
        # scripts/genconfig.py skips regeneration whenever config/autoconf.h
        # already exists — it does NOT check which board that file was
        # generated for. The checked-in config/.config currently targets
        # BOARD_LM3S6965_QB (CONFIG_NO_DYNAMIC_ALLOCATION=y among others),
        # so without this step every board's CI job silently reuses that
        # config regardless of -DBOARD. Force a clean regen here.
        rm -f config/autoconf.h config/autoconf.cmake .config
        # (optional) select this board explicitly instead of relying on
        # Kconfig defaults:
        # python3 -c "
        # import kconfiglib
        # k = kconfiglib.Kconfig('Kconfig')
        # k.syms['BOARD_QEMU_RV32_VIRT'].set_value(2)
        # k.write_config('.config')
        # "

    - name: Configure CMake
      run: |
        mkdir -p build_rv32
        cd build_rv32
        cmake -DBOARD=qemu_rv32_virt -DCMAKE_TOOLCHAIN_FILE=../config/toolchain_rv32.cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build firmware
      run: |
        cd build_rv32
        make -j$(nproc)

    - name: QEMU Smoke Boot Test (debug)
      run: |
        cd build_rv32
        timeout 30s qemu-system-riscv32 -M virt -bios none \
          -display none -serial stdio -monitor none \
          -d int,guest_errors -D ../qemu_trap.log \
          -kernel auroraOS.elf 2>&1 | tee ../boot_rv32.log || true
        echo "=== trap log ==="
        cat ../qemu_trap.log || true
        grep -q "aurora> " ../boot_rv32.log && echo "Boot OK" || (echo "Boot FAILED" && exit 1)

    - name: Check firmware size
      run: riscv64-unknown-elf-size build_rv32/auroraOS.elf

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-rv32
        path: build_rv32/auroraOS.elf

  # ═══════════════════════════════════════════════════════════════════
  # Job 4b: Target Build — MiB Band 8 (Apollo3 Blue / Cortex-M4F)
  # ═══════════════════════════════════════════════════════════════════
  build-miband8:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install ARM toolchain (Cortex-M4F hard-float)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev libstdc++-arm-none-eabi-newlib

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      run: pip3 install kconfiglib pexpect

    - name: Configure CMake (MiBand 8 hard-float)
      run: |
        mkdir -p build_miband8
        cd build_miband8
        cmake -DBOARD=miband8 \
          -DCMAKE_TOOLCHAIN_FILE=../config/toolchain_miband.cmake \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DCONFIG_ARCH_CORTEX_M4F=y \
          -DCONFIG_SYSTEM_CORE_CLOCK=96000000 \
          ..

    - name: Build firmware
      run: |
        cd build_miband8
        make -j$(nproc)

    - name: "Check firmware size (Apollo3: 576KB Flash / 384KB SRAM)"
      run: |
        arm-none-eabi-size build_miband8/auroraOS.elf
        echo "---"
        TEXT=$(arm-none-eabi-size build_miband8/auroraOS.elf | tail -1 | awk '{print $1}')
        DATA=$(arm-none-eabi-size build_miband8/auroraOS.elf | tail -1 | awk '{print $2}')
        BSS=$(arm-none-eabi-size build_miband8/auroraOS.elf | tail -1 | awk '{print $3}')
        TOTAL=$((TEXT + DATA + BSS))
        echo "Total: ${TOTAL} bytes"
        if [ $TOTAL -gt 589824 ]; then
          echo "ERROR: Firmware exceeds 576KB Apollo3 Flash limit!"
          exit 1
        fi
        if [ $((BSS)) -gt 393216 ]; then
          echo "ERROR: BSS exceeds 384KB Apollo3 SRAM limit!"
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-miband8
        path: build_miband8/auroraOS.elf

  # ═══════════════════════════════════════════════════════════════════
  # Job 5: Target Build — Cortex-M0+ (Nucleo-L031K6)
  # ═══════════════════════════════════════════════════════════════════
  build-m0plus:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install ARM toolchain
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev libstdc++-arm-none-eabi-newlib

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      run: pip3 install kconfiglib pexpect

    - name: Generate M0+ config
      run: python3 scripts/gen_m0plus_config.py
      env:
        # 保证脚本更新时 CMake 缓存失效并重新运行
        CONFIG_SCRIPT_HASH: ${{ hashFiles('scripts/gen_m0plus_config.py') }}

    - name: Configure CMake
      run: |
        mkdir -p build_m0plus
        cd build_m0plus
        cmake -DBOARD=nucleo_l031k6 -DCMAKE_TOOLCHAIN_FILE=../config/toolchain.cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build firmware
      run: |
        cd build_m0plus
        make -j$(nproc)

    - name: Check firmware size
      run: |
        arm-none-eabi-size build_m0plus/auroraOS.elf
        echo "---"
        TEXT=$(arm-none-eabi-size build_m0plus/auroraOS.elf | tail -1 | awk '{print $1}')
        DATA=$(arm-none-eabi-size build_m0plus/auroraOS.elf | tail -1 | awk '{print $2}')
        BSS=$(arm-none-eabi-size build_m0plus/auroraOS.elf | tail -1 | awk '{print $3}')
        TOTAL=$((TEXT + DATA + BSS))
        echo "Total: ${TOTAL} bytes"
        if [ $TOTAL -gt 65536 ]; then
          echo "ERROR: Firmware exceeds 64KB Flash limit!"
          exit 1
        fi
        if [ $((BSS)) -gt 8192 ]; then
          echo "WARNING: BSS exceeds 8KB RAM!"
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-m0plus
        path: build_m0plus/auroraOS.elf

  # ═══════════════════════════════════════════════════════════════════
  # Job 5b: Target Build — AArch64 (QEMU Virt)
  # ═══════════════════════════════════════════════════════════════════
  build-aarch64:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install AArch64 toolchain
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      run: pip3 install kconfiglib pexpect

    - name: Reset stale Kconfig output
      run: |
        rm -f config/autoconf.h config/autoconf.cmake .config

    - name: Configure CMake
      run: |
        mkdir -p build_aarch64
        cd build_aarch64
        cmake -DBOARD=qemu_aarch64_virt -DCMAKE_TOOLCHAIN_FILE=../config/toolchain_aarch64.cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build firmware
      run: |
        cd build_aarch64
        make -j$(nproc)

    - name: Check firmware size
      run: aarch64-linux-gnu-size build_aarch64/auroraOS.elf

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-aarch64
        path: build_aarch64/auroraOS.elf

  # ═══════════════════════════════════════════════════════════════════
  # Job 6: Code Coverage Report
  # ═══════════════════════════════════════════════════════════════════
  coverage:
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip3 install kconfiglib pexpect gcovr

    - name: Configure with coverage
      run: |
        cmake -S tests -B build_cov \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_COVERAGE=ON

    - name: Build
      run: cmake --build build_cov -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build_cov --output-on-failure --timeout 30

    - name: Generate coverage report
      run: |
        gcovr --root . \
          --filter 'kernel/' \
          --filter 'vfs/' \
          --filter 'apps/' \
          --filter 'drivers/' \
          --filter 'net/' \
          --exclude '3rdparty/' \
          --exclude 'tests/' \
          --print-summary \
          --xml-pretty \
          -o coverage.xml

    - name: Coverage summary
      run: gcovr --root . --filter 'kernel/' --filter 'vfs/' --filter 'apps/' --exclude '3rdparty/' --exclude 'tests/' --print-summary

    - name: Coverage ratchet gate
      env:
        # Ratchet: after the first run, set COVERAGE_MIN_LINE to the printed
        # line coverage (rounded down) to activate the gate; raise it as
        # coverage improves. 0.0 keeps the gate in reporting-only bootstrap.
        COVERAGE_MIN_LINE: 0.0
      run: |
        python3 - <<'EOF'
        import os
        import xml.etree.ElementTree as ET

        root = ET.parse('coverage.xml').getroot()
        rate = float(root.get('line-rate')) * 100.0
        minimum = float(os.environ.get('COVERAGE_MIN_LINE', '0'))
        print(f"Line coverage: {rate:.2f}% | ratchet minimum: {minimum:.2f}%")
        if minimum <= 0.0:
            print("::warning::Coverage ratchet INACTIVE (COVERAGE_MIN_LINE=0). "
                  "Set it to the printed line coverage to activate the gate.")
        elif rate + 1e-9 < minimum:
            print(f"::error::Line coverage {rate:.2f}% is below the ratchet minimum {minimum:.2f}%")
            raise SystemExit(1)
        EOF

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  # ═══════════════════════════════════════════════════════════════════
  # Job 7b: Target Build — Cortex-M7 (QEMU MPS2+ AN500)
  # ═══════════════════════════════════════════════════════════════════
  build-cortex-m7:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install ARM toolchain + QEMU
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev libstdc++-arm-none-eabi-newlib qemu-system-arm

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      run: pip3 install kconfiglib pexpect

    - name: Reset stale Kconfig output (must match this board, not whatever was last committed)
      run: |
        # scripts/genconfig.py skips regeneration whenever config/autoconf.h
        # already exists — force a clean regen here (same as rv32/aarch64 jobs).
        rm -f config/autoconf.h config/autoconf.cmake .config

    - name: Configure CMake
      run: |
        mkdir -p build_m7
        cd build_m7
        cmake -DBOARD=qemu_mps2_an500 -DCMAKE_TOOLCHAIN_FILE=../config/toolchain.cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build firmware
      run: |
        cd build_m7
        make -j$(nproc)

    - name: QEMU Smoke Boot Test
      run: |
        cd build_m7
        timeout 30s qemu-system-arm -M mps2-an500 -cpu cortex-m7 \
          -display none -serial stdio -monitor none \
          -kernel auroraOS.elf 2>&1 | tee ../boot_m7.log || true
        grep -q "aurora> " ../boot_m7.log && echo "Boot OK" || (echo "Boot FAILED" && exit 1)

    - name: Check firmware size
      run: arm-none-eabi-size build_m7/auroraOS.elf

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-cortex-m7
        path: build_m7/auroraOS.elf

  # ═══════════════════════════════════════════════════════════════════
  # Job 8: Firmware Size Comparison
  # ═══════════════════════════════════════════════════════════════════
  firmware-size:
    runs-on: ubuntu-24.04
    needs: [build-lm3s6965, build-rv32, build-m0plus, build-miband8, build-aarch64, build-cortex-m7]
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v4

    - name: Install size analysis tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi binutils-riscv64-unknown-elf binutils-aarch64-linux-gnu

    - name: Download all firmware artifacts
      uses: actions/download-artifact@v4
      with:
        path: firmware/

    - name: Generate size report
      run: |
        echo "# Firmware Size Report" > size_report.md
        echo "" >> size_report.md
        echo "| Target | .text | .data | .bss | Total | Flash Limit |" >> size_report.md
        echo "|--------|-------|-------|------|-------|-------------|" >> size_report.md

        # LM3S6965 (Cortex-M3)
        if [ -f firmware/firmware-lm3s6965/auroraOS.elf ]; then
          SIZE=$(arm-none-eabi-size firmware/firmware-lm3s6965/auroraOS.elf | tail -1)
          TEXT=$(echo $SIZE | awk '{print $1}')
          DATA=$(echo $SIZE | awk '{print $2}')
          BSS=$(echo $SIZE | awk '{print $3}')
          TOTAL=$((TEXT + DATA + BSS))
          echo "| LM3S6965 (Cortex-M3) | ${TEXT} | ${DATA} | ${BSS} | ${TOTAL} | 256KB |" >> size_report.md
        fi

        # RV32 (RISC-V)
        if [ -f firmware/firmware-rv32/auroraOS.elf ]; then
          SIZE=$(riscv64-unknown-elf-size firmware/firmware-rv32/auroraOS.elf | tail -1)
          TEXT=$(echo $SIZE | awk '{print $1}')
          DATA=$(echo $SIZE | awk '{print $2}')
          BSS=$(echo $SIZE | awk '{print $3}')
          TOTAL=$((TEXT + DATA + BSS))
          echo "| QEMU RV32 (RISC-V) | ${TEXT} | ${DATA} | ${BSS} | ${TOTAL} | N/A |" >> size_report.md
        fi

        # MiB Band 8 (Apollo3 Cortex-M4F)
        if [ -f firmware/firmware-miband8/auroraOS.elf ]; then
          SIZE=$(arm-none-eabi-size firmware/firmware-miband8/auroraOS.elf | tail -1)
          TEXT=$(echo $SIZE | awk '{print $1}')
          DATA=$(echo $SIZE | awk '{print $2}')
          BSS=$(echo $SIZE | awk '{print $3}')
          TOTAL=$((TEXT + DATA + BSS))
          echo "| MiBand 8 (Apollo3 M4F) | ${TEXT} | ${DATA} | ${BSS} | ${TOTAL} | 576KB |" >> size_report.md
        fi

        # M0+ (Cortex-M0+)
        if [ -f firmware/firmware-m0plus/auroraOS.elf ]; then
          SIZE=$(arm-none-eabi-size firmware/firmware-m0plus/auroraOS.elf | tail -1)
          TEXT=$(echo $SIZE | awk '{print $1}')
          DATA=$(echo $SIZE | awk '{print $2}')
          BSS=$(echo $SIZE | awk '{print $3}')
          TOTAL=$((TEXT + DATA + BSS))
          echo "| Nucleo-L031K6 (M0+) | ${TEXT} | ${DATA} | ${BSS} | ${TOTAL} | 64KB |" >> size_report.md
        fi

        # AArch64 (ARMv8-A QEMU virt)
        if [ -f firmware/firmware-aarch64/auroraOS.elf ]; then
          SIZE=$(aarch64-linux-gnu-size firmware/firmware-aarch64/auroraOS.elf | tail -1)
          TEXT=$(echo $SIZE | awk '{print $1}')
          DATA=$(echo $SIZE | awk '{print $2}')
          BSS=$(echo $SIZE | awk '{print $3}')
          TOTAL=$((TEXT + DATA + BSS))
          echo "| QEMU AArch64 (ARMv8-A) | ${TEXT} | ${DATA} | ${BSS} | ${TOTAL} | N/A |" >> size_report.md
        fi

        # Cortex-M7 (QEMU MPS2+ AN500)
        if [ -f firmware/firmware-cortex-m7/auroraOS.elf ]; then
          SIZE=$(arm-none-eabi-size firmware/firmware-cortex-m7/auroraOS.elf | tail -1)
          TEXT=$(echo $SIZE | awk '{print $1}')
          DATA=$(echo $SIZE | awk '{print $2}')
          BSS=$(echo $SIZE | awk '{print $3}')
          TOTAL=$((TEXT + DATA + BSS))
          echo "| QEMU MPS2+ AN500 (Cortex-M7) | ${TEXT} | ${DATA} | ${BSS} | ${TOTAL} | 4MB |" >> size_report.md
        fi

        cat size_report.md

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const sizeReport = fs.readFileSync('size_report.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: sizeReport
          });

  # ═══════════════════════════════════════════════════════════════════
  # Job 9: Release (tag push or manual trigger)
  # ═══════════════════════════════════════════════════════════════════
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [unit-tests, sanitize, tsan, static-analysis, cppcheck, clang-format, fuzzing, compliance-check, gitleaks, build-lm3s6965, build-rv32, build-m0plus, build-miband8, build-aarch64, build-cortex-m7, coverage, firmware-size]
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: firmware/

    - name: Extract tag name
      id: tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: auroraOS ${{ steps.tag.outputs.TAG_NAME }}
        generate_release_notes: true
        files: |
          firmware/firmware-lm3s6965/auroraOS.elf
          firmware/firmware-rv32/auroraOS.elf
          firmware/firmware-m0plus/auroraOS.elf
          firmware/firmware-miband8/auroraOS.elf
          firmware/firmware-aarch64/auroraOS.elf
          firmware/firmware-cortex-m7/auroraOS.elf
        body: |
          ## auroraOS ${{ steps.tag.outputs.TAG_NAME }}

          ### Firmware Binaries
          - **LM3S6965 (Cortex-M3)**: `firmware-lm3s6965/auroraOS.elf` — 256KB Flash
          - **QEMU RV32 (RISC-V)**: `firmware-rv32/auroraOS.elf`
          - **Nucleo-L031K6 (Cortex-M0+)**: `firmware-m0plus/auroraOS.elf` — 64KB Flash
          - **MiBand 8 (Apollo3 M4F)**: `firmware-miband8/auroraOS.elf` — 576KB Flash
          - **QEMU MPS2+ AN500 (Cortex-M7)**: `firmware-cortex-m7/auroraOS.elf` — 4MB Flash

          ### Test Results
          - Unit tests: 221 tests passing (GoogleTest / ctest)
          - Sanitizers: ASAN + UBSAN clean
          - Static Analysis: clang-tidy (reporting, high-signal checks) + cppcheck (blocking gate)
          - Fuzzing: 30s LibFuzzer run, no crash artifacts
          - HIL: QEMU boot verified

  # ═══════════════════════════════════════════════════════════════════
  # Job 7: Fuzzing (LibFuzzer)
  # ═══════════════════════════════════════════════════════════════════
  fuzzing:
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip3 install kconfiglib pexpect

    - name: Verify Clang
      run: clang --version

    - name: Configure CMake for Fuzzing
      run: |
        export CC=clang
        export CXX=clang++
        cmake -S tests -B build_fuzz -DCMAKE_BUILD_TYPE=Debug -DENABLE_FUZZING=ON

    - name: Build Fuzzer
      run: cmake --build build_fuzz -j$(nproc)

    - name: Run Fuzzing for 30 seconds (failure gate)
      # LibFuzzer writes crash-* / timeout-* / oom-* artifacts on any finding.
      # We seed fuzz_corpus/ from the committed tests/fuzzing/corpus so even a
      # short run reaches the deep parsing paths (ELF segments/sections, firewall
      # rule parser, IPC state machine) instead of stalling at input gates.
      shell: bash
      run: |
        set -uo pipefail
        mkdir -p fuzz_corpus

        # Seed the run from the committed corpus (each seed's first byte selects
        # the harness: 0=vfs 1=net 2=ipc 3=elf).
        cp tests/fuzzing/corpus/* fuzz_corpus/ 2>/dev/null || true

        # Sanity gate: the fuzzer binary must exist and be executable. A missing
        # binary previously passed silently because FUZZ_EXIT was never checked.
        if [ ! -x ./build_fuzz/aurora_fuzzer ]; then
          echo "::error::aurora_fuzzer binary not found or not executable — fuzzing target did not build"
          exit 1
        fi

        # LibFuzzer exits 0 on a clean -max_total_time timeout, and non-zero on
        # a crash / OOM / startup failure. Capture the code WITHOUT letting the
        # shell abort, then evaluate it explicitly below.
        FUZZ_EXIT=0
        ./build_fuzz/aurora_fuzzer \
          -max_total_time=30 \
          -artifact_prefix=fuzz_corpus/ \
          fuzz_corpus/ || FUZZ_EXIT=$?

        # Any crash/OOM/timeout artifact written by LibFuzzer means a real finding.
        if ls fuzz_corpus/crash-* fuzz_corpus/oom-* fuzz_corpus/timeout-* 2>/dev/null | grep -q .; then
          echo "::error::Fuzzer found crash/OOM/timeout artifact — see uploaded corpus for reproduction"
          exit 1
        fi

        # A non-zero exit with no artifact is still a failure (startup crash,
        # sanitizer abort, bad flag). Previously this case passed silently.
        if [ "$FUZZ_EXIT" -ne 0 ]; then
          echo "::error::Fuzzer exited with code $FUZZ_EXIT without a clean timeout — startup failure or non-artifact crash"
          exit 1
        fi

        echo "Fuzzing completed: no crash artifacts, clean exit."

    - name: Upload fuzz corpus on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crash-corpus
        path: fuzz_corpus/

  # ═══════════════════════════════════════════════════════════════════
  # Job 7b: Performance Benchmark CI
  #
  # Boots the LM3S6965 firmware in QEMU, enables on-target metrics sampling,
  # runs a heap workload, and captures real IRQ/context-switch/heap/power
  # latency measurements from ProcFS into a Markdown report.
  # ═══════════════════════════════════════════════════════════════════
  benchmark:
    runs-on: ubuntu-24.04
    needs: build-lm3s6965
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip3 install pexpect

    - name: Install QEMU
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends qemu-system-arm

    - name: Download LM3S6965 firmware
      uses: actions/download-artifact@v4
      with:
        name: firmware-lm3s6965
        path: build_lm3s

    - name: Run Performance Benchmark
      run: |
        python3 scripts/benchmark_runner.py --elf build_lm3s/auroraOS.elf --out metrics.log
        python3 scripts/parse_metrics.py metrics.log --md benchmark_report.md
        cat benchmark_report.md

    - name: Upload benchmark report
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-report
        path: benchmark_report.md

  # ═══════════════════════════════════════════════════════════════════
  # Job: Compliance Baseline Check  ★ BLOCKING GATE ★
  #
  # Parses docs/compliance_baseline.md <!-- CHECK:... --> annotations
  # and verifies each rule against the repository.  Any FAIL exits 1
  # and blocks the release job.
  # ═══════════════════════════════════════════════════════════════════
  compliance-check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run compliance baseline check
      run: python3 scripts/check_compliance.py --repo-root .

    - name: Upload compliance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compliance-report
        path: compliance_report.txt
      continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════
  # Job: Secret scanning (gitleaks) — BLOCKING GATE
  #
  # Full-history scan with the default rule set; `.gitleaks.toml` extends
  # the defaults and allowlists vendored 3rdparty/ code (upstream test
  # keys and fixtures are not AuroraOS secrets).
  # ═══════════════════════════════════════════════════════════════════
  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
